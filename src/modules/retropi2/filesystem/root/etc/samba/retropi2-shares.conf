# Retro Pi 2.0 network shares.
#
# Included from smb.conf. Guest access with no password, which matches
# what RetroPie did and is the point of the exercise: drag games in from
# Explorer with no faff. Everything is written as the 'pi' user so the
# files end up owned correctly.
#
# This is fine on a home LAN and nowhere else. If this box ever sits on
# a shared or public network, delete this file and use SSH/scp instead.

[roms]
   comment = Retro Pi 2.0 games
   path = /home/pi/roms
   browseable = yes
   writeable = yes
   guest ok = yes
   create mask = 0664
   directory mask = 0775
   force user = pi
   force group = pi

[media]
   comment = Retro Pi 2.0 local movies and TV
   path = /home/pi/media
   browseable = yes
   writeable = yes
   guest ok = yes
   create mask = 0664
   directory mask = 0775
   force user = pi
   force group = pi

[usb]
   comment = USB drives plugged into the Pi
   path = /media
   browseable = yes
   writeable = yes
   guest ok = yes
   force user = pi
   force group = pi
